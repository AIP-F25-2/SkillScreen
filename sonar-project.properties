sonar.projectKey=skillscreen
sonar.organization=aip-f25-2
sonar.projectName=SkillScreen
sonar.projectVersion=1.0.0

# Source code
sonar.sources=backend/text-service,frontend/streamlit-app,shared
sonar.python.version=3.11

# Exclusions
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/venv/**,**/env/**,**/.git/**,**/logs/**,**/k8s/**,**/docker-compose.yml,**/Dockerfile

# Coverage exclusions
sonar.coverage.exclusions=**/test_*,**/tests/**,**/__pycache__/**,**/logs/**

# Python specific settings
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.bandit.reportPaths=bandit-report.json

# Code quality gates
sonar.qualitygate.wait=true

# Quality gate configuration
sonar.qualitygate.conditions=Reliability Rating,Security Rating,Duplicated Lines (%),Security Hotspots Reviewed (%)

# Coverage configuration
sonar.python.coverage.reportPaths=backend/text-service/coverage.xml
sonar.coverage.exclusions=**/test_*,**/tests/**,**/__pycache__/**,**/logs/**

# Duplication configuration
sonar.cpd.python.minimumtokens=100
sonar.cpd.python.minimumlines=5
