# SkillScreen Platform - Development Environment (Azure Postgres)

services:

  # Core Infrastructure Services (5000-5009)
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "5001:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      SECRET_KEY: supersecret
      ALGORITHM: HS256
      USER_SERVICE_URL: http://user-service:8080
      SSO_SERVICE_URL: http://sso-service:8080
      ASSESSMENT_SERVICE_URL: http://assessment-service:8005
      CODING_SERVICE_URL: http://coding-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      TEXT_SERVICE_URL: http://text-service:8080
      AUDIO_AI_SERVICE_URL: http://audio-ai-service:8080
      VIDEO_AI_SERVICE_URL: http://video-ai-service:8080
      TEXT_AI_SERVICE_URL: http://text-ai-service:8080
      INTERVIEW_SERVICE_URL: http://interview-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      LOGGER_SERVICE_URL: http://logger-service:8080
      ORCHESTRATION_SERVICE_URL: http://orchestration-service:8080
    volumes:
      - ./backend/api-gateway:/app
    depends_on:
      - user-service
      - sso-service
      - assessment-service
      - coding-service
      - interview-service
      - text-ai-service
      - orchestration-service
    networks:
      - skill-screen-network

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      PYTHONPATH: /app:/common-service
      # logging
      ENV: dev
      LOG_LEVEL: DEBUG
      LOG_TO_FILE: 'true'
      LOG_DIR: /var/log/app
      LOG_FILE: user-service.log
      ENABLE_SEQ: 'false'
      SEQ_URL: http://seq:5341
    volumes:
      - ./backend/user-service:/app
      - ./backend/common-service:/common-service
      - ./_logs:/var/log/app
    depends_on:
      - seq
    networks:
      - skill-screen-network

  assessment-service:
    build:
      context: ./backend/assessment-service
      dockerfile: Dockerfile
    container_name: assessment-service
    platform: linux/amd64
    ports:
      - "8005:8005"
    env_file:
      - ./backend/assessment-service/.env   
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - USE_LLM_WEIGHTS=false   
    volumes:
      - ./backend/assessment-service:/app
      - ./backend/common-service:/common-service
    networks:
      - skill-screen-network

  coding-service:
    build:
      context: ./backend/coding-service
      dockerfile: Dockerfile
    container_name: coding-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - PYTHONPATH=/app:/common-service
      # logging
      - ENV=dev
      - LOG_LEVEL=DEBUG
      - LOG_TO_FILE=true
      - LOG_DIR=/var/log/app
      - LOG_FILE=coding-service.log
      - ENABLE_SEQ=false
      - SEQ_URL=http://seq:5341
      - JUDGE0_BASE_URL=https://judge0-ce.p.rapidapi.com
      - JUDGE0_RAPIDAPI_KEY=51a8a459afmsh0d9fa8864da57d9p19258fjsn0a24328cb69c
      - JUDGE0_RAPIDAPI_HOST=judge0-ce.p.rapidapi.com
    volumes:
      - ./backend/coding-service:/app
      - ./backend/common-service:/common-service
      - ./_logs:/var/log/app
    depends_on:
      - seq
    networks:
      - skill-screen-network

  # AI Services
  # text-service:
  #   build:
  #     context: ./backend/text-service
  #     dockerfile: Dockerfile.dev
  #   container_name: text-service
  #   ports:
  #     - "8001:8080"
  #   environment:
  #     PORT: 8080
  #     HOST: 0.0.0.0
  #     APP_NAME: text-service
  #     ENVIRONMENT: development
  #     DEBUG: 'True'
  #     LOG_LEVEL: INFO
  #     DATABASE_URL: postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
  #   volumes:
  #     - ./backend/text-service:/app
  #   networks:
  #     - skill-screen-network

  audio-ai-service:
    build:
      context: ./backend/audio-ai-service
      dockerfile: Dockerfile
    container_name: audio-ai-service
    platform: linux/amd64
    ports:
      - "8000:8080"
    env_file:
      - ./backend/audio-ai-service/.env  
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      APP_NAME: audio-ai-service
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: INFO
      WHISPER_MODEL_SIZE: base
      WHISPER_DEVICE: cpu
      PYTHONPATH: /app:/common-service
    volumes:
      - ./backend/audio-ai-service:/app
      - ./backend/common-service:/common-service
    networks:
      - skill-screen-network

  video-ai-service:
    build:
      context: ./backend/video-ai-service
      dockerfile: Dockerfile
    container_name: video-ai-service
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
    volumes:
      - ./backend/video-ai-service:/app
    networks:
      - skill-screen-network

  text-ai-service:
    build:
      context: ./backend/text-ai-service
      dockerfile: Dockerfile
    container_name: text-ai-service
    ports:
      - "8002:8080"
    env_file:
      - ./backend/text-ai-service/.env  
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      APP_NAME: text-ai-service
      ENVIRONMENT: development
      DEBUG: 'True'
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
    volumes:
      - ./backend/text-ai-service:/app
      - ./backend/common-service:/common-service
    depends_on:
      - seq
    networks:
      - skill-screen-network

  # Specialized Services
  interview-service:
    build:
      context: ./backend/interview-service
      dockerfile: Dockerfile
    container_name: interview-service
    ports:
      - "8003:8080"
    env_file:
      - ./backend/interview-service/.env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - PYTHONPATH=/app:/common-service
      - CORS_ORIGINS=http://localhost:3000
      - AZURE_RESUME_SAS_URL=https://skillscreenstorage00.blob.core.windows.net/resumes?sp=racwdl&st=2025-11-18T22:03:40Z&se=2026-01-01T06:18:40Z&spr=https&sv=2024-11-04&sr=c&sig=OwDaTiu32nUCTpk3OCrcHtwbUELDWpGBh8PGcNZ3r0o%3D
    volumes:
      - ./backend/interview-service:/app
      - ./backend/common-service:/common-service
    networks:
      - skill-screen-network

  media-service:
    build:
      context: ./backend/media-service
      dockerfile: Dockerfile
    container_name: media-service
    ports:
      - "8004:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      CORS_ORIGINS: http://localhost:3000
      PYTHONPATH: /app:/common-service
      USE_AZURE_STORAGE: 'false'
    volumes:
      - ./backend/media-service:/app
      - ./backend/common-service:/common-service
    networks:
      - skill-screen-network

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
    volumes:
      - ./backend/notification-service:/app
    networks:
      - skill-screen-network

  sso-service:
    build:
      context: ./backend/sso-service
      dockerfile: Dockerfile
    container_name: sso-service
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      SECRET_KEY: supersecret
      ALGORITHM: HS256
      DATABASE_URL: postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
    volumes:
      - ./backend/sso-service:/app
    networks:
      - skill-screen-network

  common-service:
    build:
      context: ./backend/common-service
      dockerfile: Dockerfile
    container_name: common-service
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      SEQ_URL: http://seq:5341
      # logging
      ENV: dev
      LOG_LEVEL: DEBUG
      LOG_TO_FILE: 'true'
      LOG_DIR: /var/log/app
      LOG_FILE: user-service.log
      ENABLE_SEQ: 'true'
    volumes:
      - ./backend/common-service:/app
      - ./_logs:/var/log/app
    depends_on:
      - seq
    networks:
      - skill-screen-network

  orchestration-service: 
    build:
      context: ./backend/orchestration-service
      dockerfile: Dockerfile
    container_name: orchestration-service
    env_file:
      - ./backend/orchestration-service/.env
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      INTERVIEW_SERVICE_URL: http://interview-service:8080
      #TEXT_SERVICE_URL: http://text-service:8080
      TEXT_SERVICE_URL: http://text-ai-service:8080
      AUDIO_AI_SERVICE_URL: http://audio-ai-service:8080
      VIDEO_AI_SERVICE_URL: http://video-ai-service:8080
      MEDIA_SERVICE_URL: http://media-service:8080
      ASSESSMENT_SERVICE_URL: http://assessment-service:8005
    volumes:
      - ./backend/orchestration-service:/app
    depends_on:
      - interview-service
      #- text-service
      - audio-ai-service
      - media-service
      - assessment-service
      - video-ai-service
      - text-ai-service
    networks:
      - skill-screen-network 

  seq:
    image: datalust/seq:2024.3
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:5341" # ingestion endpoint
      - "8081:80" # web UI -> http://localhost:8081
    volumes:
      - seq-data:/data
    networks:
      - skill-screen-network

networks:
  skill-screen-network:
    driver: bridge

volumes:
  seq-data: {}