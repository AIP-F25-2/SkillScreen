# SkillScreen Platform - Development Environment (Azure Postgres)
version: '3.8'

services:
  # Core Infrastructure Services (5000-5009)
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "5000:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - SECRET_KEY=supersecret
      - ALGORITHM=HS256
      - USER_SERVICE_URL=http://user-service:8080
      - SSO_SERVICE_URL=http://sso-service:8080
      - ASSESSMENT_SERVICE_URL=http://assessment-service:8080
      - CODING_SERVICE_URL=http://coding-service:8080
    volumes:
      - ./backend/api-gateway:/app
    depends_on:
      - user-service
      - sso-service
      - assessment-service
      - coding-service
    networks:
      - skill-screen-network

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - PYTHONPATH=/app:/common-service
    volumes:
      - ./backend/user-service:/app
      - ./backend/common-service:/common-service
    networks:
      - skill-screen-network

  assessment-service:
    build:
      context: ./backend/assessment-service
      dockerfile: Dockerfile
    container_name: assessment-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - ./backend/assessment-service:/app
    networks:
      - skill-screen-network

  coding-service:
    build:
      context: ./backend/coding-service
      dockerfile: Dockerfile
    container_name: coding-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - ./backend/coding-service:/app
    networks:
      - skill-screen-network

  # AI Services
  ai-logic-service:
    build:
      context: ./backend/ai-logic-service
      dockerfile: Dockerfile.dev
    container_name: ai-logic-service
    ports:
      - "8001:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - APP_NAME=ai-logic-service
      - ENVIRONMENT=development
      - DEBUG=True
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/ai-logic-service:/app
    networks:
      - skill-screen-network

  audio-ai-service:
    build:
      context: ./backend/audio-ai-service
      dockerfile: Dockerfile
    container_name: audio-ai-service
    platform: linux/amd64
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - APP_NAME=audio-ai-service
      - ENVIRONMENT=development
      - DEBUG=True
      - LOG_LEVEL=INFO
      - WHISPER_MODEL_SIZE=base
      - WHISPER_DEVICE=cpu
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
    volumes:
      - ./backend/audio-ai-service:/app
    networks:
      - skill-screen-network

  video-ai-service:
    build:
      context: ./backend/video-ai-service
      dockerfile: Dockerfile
    container_name: video-ai-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - ./backend/video-ai-service:/app
    networks:
      - skill-screen-network

  text-ai-service:
    build:
      context: ./backend/text-ai-service
      dockerfile: Dockerfile
    container_name: text-ai-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - ./backend/text-ai-service:/app
    networks:
      - skill-screen-network

  # Specialized Services
  interview-service:
    build:
      context: ./backend/interview-service
      dockerfile: Dockerfile
    container_name: interview-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - ./backend/interview-service:/app
    networks:
      - skill-screen-network

  media-service:
    build:
      context: ./backend/media-service
      dockerfile: Dockerfile
    container_name: media-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - ./backend/media-service:/app
    networks:
      - skill-screen-network

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - ./backend/notification-service:/app
    networks:
      - skill-screen-network

  logger-service:
    build:
      context: ./backend/logger-service
      dockerfile: Dockerfile
    container_name: logger-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - ./backend/logger-service:/app
    networks:
      - skill-screen-network

  sso-service:
    build:
      context: ./backend/sso-service
      dockerfile: Dockerfile
    container_name: sso-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - SECRET_KEY=supersecret
      - ALGORITHM=HS256
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - ./backend/sso-service:/app
    networks:
      - skill-screen-network

  common-service:
    build:
      context: ./backend/common-service
      dockerfile: Dockerfile
    container_name: common-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - ./backend/common-service:/app
    networks:
      - skill-screen-network

networks:
  skill-screen-network:
    driver: bridge
