# SkillScreen Platform - Development Environment (Azure Postgres)

services:

  seq:
    image: datalust/seq:2024.3
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data
    networks:
      - skill-screen-network

  # Core Infrastructure Services (5000-5009)
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "5001:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - SECRET_KEY=supersecret
      - ALGORITHM=HS256
      - USER_SERVICE_URL=http://user-service:8080
      - SSO_SERVICE_URL=http://sso-service:8080
      - ASSESSMENT_SERVICE_URL=http://assessment-service:8080
      - CODING_SERVICE_URL=http://coding-service:8080
      - MEDIA_SERVICE_URL=http://media-service:8080
      - TEXT_SERVICE_URL=http://text-service:8080
      - AUDIO_AI_SERVICE_URL=http://audio-ai-service:8080
      - VIDEO_AI_SERVICE_URL=http://video-ai-service:8080
      - TEXT_AI_SERVICE_URL=http://text-ai-service:8080
      - INTERVIEW_SERVICE_URL=http://interview-service:8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:8080
      - LOGGER_SERVICE_URL=http://logger-service:8080
    volumes:
      - ./backend/api-gateway:/app
    depends_on:
      - user-service
      - sso-service
      - assessment-service
      - coding-service
      - interview-service
      - text-service
    networks:
      - skill-screen-network

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - PYTHONPATH=/app:/common-service
      # logging
      - ENV=dev
      - LOG_LEVEL=INFO
      - LOG_FORMAT=text
      - LOG_TO_FILE=true
      - LOG_DIR=/var/log/app
      - LOG_FILE=user-service.log
      - ENABLE_SEQ=false
      - SEQ_URL=http://seq:5341
    volumes:
      - ./backend/user-service:/app
      - ./backend/common-service:/common-service
      - ./_logs:/var/log/app
    depends_on:
      - seq
    networks:
      - skill-screen-network

  assessment-service:
    build:
      context: ./backend/assessment-service
      dockerfile: Dockerfile
    container_name: assessment-service
    platform: linux/amd64
    ports:
      - "8005:8005"
    env_file:
      - ./backend/assessment-service/.env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - USE_LLM_WEIGHTS=false
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - ./backend/assessment-service:/app
      - ./backend/common-service:/common-service
    networks:
      - skill-screen-network

  coding-service:
    build:
      context: ./backend/coding-service
      dockerfile: Dockerfile
    container_name: coding-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - PYTHONPATH=/app:/common-service:/app/text-service
      # logging
      - ENV=dev
      - LOG_LEVEL=INFO
      - LOG_FORMAT=text
      - LOG_TO_FILE=true
      - LOG_DIR=/var/log/app
      - LOG_FILE=coding-service.log
      - ENABLE_SEQ=false
      - SEQ_URL=http://seq:5341
      - JUDGE0_BASE_URL=${JUDGE0_BASE_URL:-}
      - JUDGE0_RAPIDAPI_KEY=${JUDGE0_RAPIDAPI_KEY:-}
      - JUDGE0_RAPIDAPI_HOST=${JUDGE0_RAPIDAPI_HOST:-}
      # LLM API Keys (for personalized question generation)
      # Get your keys from: Gemini (https://aistudio.google.com/app/apikey), Groq (https://console.groq.com/), Mistral (https://console.mistral.ai/), SerpApi (https://serpapi.com/)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
    volumes:
      - ./backend/coding-service:/app
      - ./backend/common-service:/common-service
      # Mount text-service code so coding-service can import EnhancedLLMService
      # Mount the entire text-service directory structure for proper imports
      - ./backend/text-service:/app/text-service
      - ./_logs:/var/log/app
    depends_on:
      - seq
      - text-service
    networks:
      - skill-screen-network

  # AI Services
  text-service:
    build:
      context: ./backend/text-service
      dockerfile: Dockerfile.dev
    container_name: text-service
    ports:
      - "8001:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - APP_NAME=text-service
      - ENVIRONMENT=development
      - DEBUG=True
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      # LLM API Keys (for enhanced LLM service with multi-LLM support)
      # Get your keys from: Gemini (https://aistudio.google.com/app/apikey), Groq (https://console.groq.com/), Mistral (https://console.mistral.ai/), SerpApi (https://serpapi.com/)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
    volumes:
      - ./backend/text-service:/app
    networks:
      - skill-screen-network

  audio-ai-service:
    build:
      context: ./backend/audio-ai-service
      dockerfile: Dockerfile
    container_name: audio-ai-service
    platform: linux/amd64
    ports:
      - "8000:8080"
    env_file:
      - ./backend/audio-ai-service/.env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - APP_NAME=audio-ai-service
      - ENVIRONMENT=development
      - DEBUG=True
      - LOG_LEVEL=INFO
      - WHISPER_MODEL_SIZE=base
      - WHISPER_DEVICE=cpu
      - PYTHONPATH=/app:/common-service
      - AZURE_STORAGE_ACCOUNT_NAME=skillscreenstorage00
      - AZURE_STORAGE_CONTAINER_NAME=audio-recordings
      - AZURE_STORAGE_SAS_TOKEN=sp=racwdl&st=2025-11-18T21:59:51Z&se=2026-01-01T06:14:51Z&spr=https&sv=2024-11-04&sr=c&sig=JpSO0RP%2Bd2jaQfpUWNcjmgunr9ty22YAvehAogh4ifU%3D
    volumes:
      - ./backend/audio-ai-service:/app
      - ./backend/common-service:/common-service
    networks:
      - skill-screen-network

  video-ai-service:
    build:
      context: ./backend/video-ai-service
      dockerfile: Dockerfile
    container_name: video-ai-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
    volumes:
      - ./backend/video-ai-service:/app
    networks:
      - skill-screen-network

  text-ai-service:
    build:
      context: ./backend/text-ai-service
      dockerfile: Dockerfile
    container_name: text-ai-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
    volumes:
      - ./backend/text-ai-service:/app
    networks:
      - skill-screen-network

  # Specialized Services
  interview-service:
    build:
      context: ./backend/interview-service
      dockerfile: Dockerfile
    container_name: interview-service
    ports:
      - "8003:8080"
    env_file:
      - ./backend/interview-service/.env
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - PYTHONPATH=/app:/common-service
      - CORS_ORIGINS=http://localhost:3000
      - AZURE_RESUME_SAS_URL=https://skillscreenstorage00.blob.core.windows.net/resumes?sp=racwdl&st=2025-11-18T22:03:40Z&se=2026-01-01T06:18:40Z&spr=https&sv=2024-11-04&sr=c&sig=OwDaTiu32nUCTpk3OCrcHtwbUELDWpGBh8PGcNZ3r0o%3D
    volumes:
      - ./backend/interview-service:/app
      - ./backend/common-service:/common-service
    networks:
      - skill-screen-network

  media-service:
    build:
      context: ./backend/media-service
      dockerfile: Dockerfile
    container_name: media-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - PYTHONPATH=/app:/common-service
      - CORS_ORIGINS=http://localhost:3000
      - PYTHONPATH=/app:/common-service
      - AZURE_BLOB_CONTAINER_URL=https://skillscreenstorage00.blob.core.windows.net/video-recordings?sp=racwdl&st=2025-11-18T22:02:53Z&se=2026-01-01T06:17:53Z&spr=https&sv=2024-11-04&sr=c&sig=7nA14qtnnJ6wGV9Mu5RQJDPBfLANTdFu2rcgD1QikBI%3D
      - AZURE_BLOB_CONTAINER=video-recordings
    volumes:
      - ./backend/media-service:/app
      - ./backend/common-service:/common-service
    networks:
      - skill-screen-network

  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
    volumes:
      - ./backend/notification-service:/app
    networks:
      - skill-screen-network

  sso-service:
    build:
      context: ./backend/sso-service
      dockerfile: Dockerfile
    container_name: sso-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - SECRET_KEY=supersecret
      - ALGORITHM=HS256
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - PYTHONPATH=/app:/common-service
      - PYTHONPATH=/app:/common-service:/user-service
    volumes:
      - ./backend/sso-service:/app
      - ./backend/common-service:/common-service
      - ./backend/user-service:/user-service
    networks:
      - skill-screen-network

  common-service:
    build:
      context: ./backend/common-service
      dockerfile: Dockerfile
    container_name: common-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - SEQ_URL=http://seq:5341
      # logging
      - ENV=dev
      - LOG_LEVEL=DEBUG
      - LOG_TO_FILE=true
      - LOG_DIR=/var/log/app
      - LOG_FILE=user-service.log
      - ENABLE_SEQ=false
      - SEQ_URL=http://seq:5341
    volumes:
      - ./backend/common-service:/app
      - ./_logs:/var/log/app
    depends_on:
      - seq
    networks:
      - skill-screen-network

  orchestration-service:
    build:
      context: ./backend/orchestration-service
      dockerfile: Dockerfile
    container_name: orchestration-service
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://intervuai:LOYALlist_2025@skillscreen-postgres.postgres.database.azure.com:5432/skillscreen_database?sslmode=require
      - PYTHONPATH=/app:/common-service
      # Service URLs
      - INTERVIEW_SERVICE_URL=http://interview-service:8080
      - TEXT_SERVICE_URL=http://text-service:8080
      - CODING_SERVICE_URL=http://coding-service:8080
      # logging
      - ENV=dev
      - LOG_LEVEL=INFO
      - LOG_FORMAT=text
      - LOG_TO_FILE=true
      - LOG_DIR=/var/log/app
      - LOG_FILE=orchestration-service.log
      - ENABLE_SEQ=false
      - SEQ_URL=http://seq:5341
      - JUDGE0_RAPIDAPI_KEY=e6334e0abcmshcb21a98ad960c8ep1594b5jsnb67cbdc3dfef
    volumes:
      - ./backend/orchestration-service:/app
      - ./backend/common-service:/common-service
      - ./_logs:/var/log/app
    depends_on:
      - seq
    networks:
      - skill-screen-network

networks:
  skill-screen-network:
    driver: bridge

volumes:
  seq-data: {}
  sonarqube_data: {}
  sonarqube_extensions: {}
  sonarqube_logs: {}
