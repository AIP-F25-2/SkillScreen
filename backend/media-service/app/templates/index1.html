<!DOCTYPE html>
<html>
<head>
  <title>Video Admin Dashboard</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; margin: 0; padding: 0; }
    .container { width: 95%; margin: 20px auto; }
    h1, h2 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    table, th, td { border: 1px solid #ccc; }
    th, td { padding: 8px; text-align: left; }
    th { background: #007bff; color: #fff; }
    tr:nth-child(even) { background: #f9f9f9; }
    button { padding: 5px 10px; margin-right: 5px; cursor: pointer; border: none; border-radius: 4px; background: #28a745; color: #fff; }
    button.delete { background: #dc3545; }
    button.preview { background: #17a2b8; }
    .flex-row { display: flex; align-items: center; margin-bottom: 10px; gap: 5px; flex-wrap: wrap; }
    input[type=text], input[type=file] { padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
    .section { padding: 20px; background: #fff; border-radius: 6px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .recording-section video { max-width: 400px; border: 1px solid #ccc; margin-top: 10px; border-radius: 4px; }
    .hint { font-size: 12px; color: #666; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</head>
<body>
<div class="container">
  <h1>Admin Video Dashboard</h1>

  <!-- Recording Section -->
  <div class="section recording-section">
    <h2>Recording Control</h2>
    <div class="flex-row">
      <input type="text" id="recordUserId" placeholder="Enter User ID for Recording">
      <button id="startRecBtn">Start Recording</button>
      <button id="stopRecBtn" disabled>Stop Recording</button>
    </div>
    <video id="livePreview" autoplay muted playsinline style="display:none;"></video>
    <div class="hint">
      Uses: <code class="mono">/reset_chunks</code>, <code class="mono">/upload_chunk</code>, <code class="mono">/chunks/status</code>, <code class="mono">/finalize_upload</code>
    </div>
  </div>

  <!-- Users -->
  <div class="section">
    <h2>Users Management</h2>
    <div class="flex-row">
      <input type="text" id="newUserId" placeholder="New User ID">
      <button onclick="createUser()">Create User</button>
      <button onclick="loadUsers()">Load Users</button>
      <button onclick="deleteAllUsers()" class="delete">Delete All Users</button>
    </div>
    <table id="usersTable">
      <thead><tr><th>User ID</th><th>Actions</th><th>Videos</th><th>Files</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Videos -->
  <div class="section">
    <h2>Search Videos</h2>
    <div class="flex-row">
      <input type="text" id="videoQuery" placeholder="Search videos">
      <button onclick="searchVideos()">Search</button>
    </div>
    <table id="videosTable">
      <thead><tr><th>User</th><th>Video</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Files -->
  <div class="section">
    <h2>General Files Management</h2>
    <div class="flex-row">
      <input type="text" id="fileUserId" placeholder="User ID for Upload">
      <input type="file" id="generalFile">
      <button onclick="uploadGeneralFile()">Upload File</button>
    </div>
    <div class="flex-row">
      <input type="text" id="fileQuery" placeholder="Search files">
      <button onclick="searchFiles()">Search</button>
    </div>
    <table id="filesTable">
      <thead><tr><th>User</th><th>File</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
async function fetchJSON(url, options) {
  const res = await fetch(url, options);
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
  if (!res.ok) {
    const msg = (data && (data.error || data.message)) ? (data.error || data.message) : `HTTP ${res.status}`;
    throw new Error(msg);
  }
  return data;
}

// ---------------------- Recording (forced chunking) ----------------------
let mediaRecorder, liveStream;
let chunkIndex = 0;
let requestTimer = null;
let sessionId = null;   // helps uniqueness if multiple sessions

const CHUNK_MS = 1000; // 1s chunks; adjust as you like

function chunkName(idx) {
  const n = (idx + 1).toString().padStart(5, "0");
  return `chunk-${n}.webm`; // server sorts on numeric part
}

document.getElementById('startRecBtn').addEventListener('click', async () => {
  const userId = document.getElementById('recordUserId').value.trim();
  if (!userId) return alert('Enter User ID');

  // reset any previous chunks on server
  await fetchJSON('/reset_chunks', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ user_id: userId })
  });

  // start stream
  liveStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  const preview = document.getElementById('livePreview');
  preview.srcObject = liveStream;
  preview.style.display = 'block';

  chunkIndex = 0;
  sessionId = Date.now().toString(36);

  // Don’t rely on timeslice (inconsistent across browsers). Start and pull data every CHUNK_MS.
  mediaRecorder = new MediaRecorder(liveStream, { mimeType: 'video/webm;codecs=vp8,opus' });

  mediaRecorder.ondataavailable = async (e) => {
    if (!e.data || e.data.size === 0) return;
    const idx = chunkIndex++;
    const filename = chunkName(idx);

    const form = new FormData();
    form.append('file', new Blob([e.data], { type: 'video/webm' }), filename);
    form.append('user_id', userId);
    form.append('chunk_index', String(idx));       // backend can track
    form.append('session_id', sessionId);          // optional for your own audit
    // we’ll give the final total at stop via /chunks/status just before finalize

    try {
      await fetch('/upload_chunk', { method: 'POST', body: form });
    } catch (err) {
      console.error('Chunk upload failed:', err);
    }
  };

  mediaRecorder.start(); // no timeslice
  // Force periodic chunks across browsers
  requestTimer = setInterval(() => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      try { mediaRecorder.requestData(); } catch (e) { /* ignore */ }
    }
  }, CHUNK_MS);

  document.getElementById('startRecBtn').disabled = true;
  document.getElementById('stopRecBtn').disabled = false;
});

document.getElementById('stopRecBtn').addEventListener('click', async () => {
  const userId = document.getElementById('recordUserId').value.trim();
  if (!userId) return alert('Enter User ID');

  try { clearInterval(requestTimer); } catch(e) {}
  requestTimer = null;

  // Stop recorder & stream
  try { mediaRecorder.requestData(); } catch(e) {}
  try { mediaRecorder.stop(); } catch (e) {}
  try { liveStream.getTracks().forEach(t => t.stop()); } catch (e) {}
  document.getElementById('livePreview').style.display = 'none';
  document.getElementById('startRecBtn').disabled = false;
  document.getElementById('stopRecBtn').disabled = true;

  // small delay to ensure final ondataavailable fires & uploads
  await new Promise(r => setTimeout(r, 400));

  // Ask backend what it has; if missing chunks, we can retry those (client keeps no cache here,
  // but you could store blobs in memory to re-send if you want).
  let status;
  try {
    status = await fetchJSON(`/admin/search/users?q=${encodeURIComponent('')}`); // noop to warm server
  } catch (e) {}

  try {
    const stat = await fetchJSON(`/chunks/status?user_id=${encodeURIComponent(userId)}`);
    if (stat.missing && stat.missing.length) {
      alert(`Server is missing ${stat.missing.length} chunks: [${stat.missing.join(', ')}]. Cannot merge.`);
      return;
    }
  } catch (e) {
    console.warn('Status check failed (continuing to finalize):', e.message);
  }

  // Merge
  try {
    const data = await fetchJSON('/finalize_upload', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ user_id: userId })
    });
    alert(`Recording finalized: ${data.file}`);
    loadUserVideos(userId);
  } catch (e) {
    alert('Finalize failed: ' + e.message);
  }
});

// ---------------------- Users ----------------------
async function loadUsers() {
  const data = await fetchJSON('/admin/users');
  const tbody = document.querySelector('#usersTable tbody');
  tbody.innerHTML = '';
  (data.users || []).forEach(user => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${user}</td>
      <td>
        <button onclick="renameUser('${user}')">Rename</button>
        <button onclick="deleteUser('${user}')" class="delete">Delete</button>
      </td>
      <td><div id="videos-${user}">Loading...</div></td>
      <td><div id="files-${user}">Loading...</div></td>`;
    tbody.appendChild(tr);
    loadUserVideos(user);
    loadUserFiles(user);
  });
}

async function createUser() {
  const userId = document.getElementById('newUserId').value.trim();
  if (!userId) return alert('Enter User ID');
  await fetchJSON('/admin/user', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({user_id: userId})
  });
  loadUsers();
}

async function renameUser(oldId) {
  const newId = prompt('New User ID for ' + oldId);
  if (!newId) return;
  await fetchJSON(`/admin/user/${oldId}`, {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({new_user_id: newId})
  });
  loadUsers();
}

async function deleteUser(userId) {
  if (!confirm(`Delete user ${userId}?`)) return;
  await fetchJSON(`/admin/user/${userId}`, { method:'DELETE' });
  loadUsers();
}

async function deleteAllUsers() {
  if (!confirm('Delete ALL users?')) return;
  await fetchJSON('/admin/users', { method:'DELETE' });
  loadUsers();
}

// ---------------------- Videos ----------------------
async function loadUserVideos(userId) {
  const div = document.getElementById(`videos-${userId}`);
  const data = await fetchJSON(`/admin/videos/${userId}`);
  if (!data.videos || data.videos.length === 0) {
    div.innerHTML = 'No videos';
    return;
  }
  div.innerHTML = '';
  data.videos.forEach(video => {
    const videoDiv = document.createElement('div');
    videoDiv.innerHTML = `${video} 
      <button class="preview" onclick="previewVideo('${userId}','${video}')">Preview</button>
      <button class="delete" onclick="deleteVideo('${userId}','${video}')">Delete</button>`;
    div.appendChild(videoDiv);
  });
}

async function deleteVideo(userId, filename) {
  if (!confirm(`Delete video ${filename}?`)) return;
  await fetchJSON(`/admin/video/${userId}/${filename}`, { method:'DELETE' });
  loadUserVideos(userId);
}

function previewVideo(userId, filename) {
  const win = window.open(`/admin/video/${userId}/preview/${filename}`, '_blank');
  if (!win) alert('Popup blocked, enable popups to preview');
}

async function searchVideos() {
  const query = document.getElementById('videoQuery').value.trim();
  const data = await fetchJSON(`/admin/search/videos?q=${encodeURIComponent(query)}`);
  const tbody = document.querySelector('#videosTable tbody');
  tbody.innerHTML = '';
  for (let user in data.matched_videos) {
    data.matched_videos[user].forEach(video => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${user}</td>
        <td>${video}</td>
        <td>
          <button class="preview" onclick="previewVideo('${user}','${video}')">Preview</button>
          <button class="delete" onclick="deleteVideo('${user}','${video}')">Delete</button>
        </td>`;
      tbody.appendChild(tr);
    });
  }
}

// ---------------------- Files ----------------------
async function uploadGeneralFile() {
  const userId = document.getElementById('fileUserId').value.trim();
  const fileInput = document.getElementById('generalFile');
  if (!userId || fileInput.files.length === 0) return alert('Select user and file');

  const formData = new FormData();
  formData.append('user_id', userId);
  formData.append('file', fileInput.files[0]);

  const res = await fetch('/upload_general_file', { method:'POST', body:formData });
  const data = await res.json();

  if (!res.ok) {
    alert('Upload failed: ' + (data.error || res.status));
    return;
  }
  alert(`File uploaded successfully!\n\nPath: ${data.file_path}`);
  loadUserFiles(userId);
}

async function loadUserFiles(userId) {
  const div = document.getElementById(`files-${userId}`);
  const data = await fetchJSON(`/admin/files/${userId}`);
  if (!data.files || data.files.length === 0) {
    div.innerHTML = 'No files';
    return;
  }
  div.innerHTML = '';
  data.files.forEach(file => {
    const fileDiv = document.createElement('div');
    fileDiv.innerHTML = `${file}
      <button class="preview" onclick="previewFile('${userId}','${file}')">Open</button>
      <button class="delete" onclick="deleteFile('${userId}','${file}')">Delete</button>`;
    div.appendChild(fileDiv);
  });
}

async function deleteFile(userId, filename) {
  if (!confirm(`Delete file ${filename}?`)) return;
  await fetchJSON(`/admin/file/${userId}/${filename}`, { method:'DELETE' });
  loadUserFiles(userId);
}

function previewFile(userId, filename) {
  window.open(`/file/${userId}/${filename}`, '_blank');
}

async function searchFiles() {
  const query = document.getElementById('fileQuery').value.trim();
  const data = await fetchJSON(`/admin/search/files?q=${encodeURIComponent(query)}`);
  const tbody = document.querySelector('#filesTable tbody');
  tbody.innerHTML = '';
  for (let user in data.matched_files) {
    data.matched_files[user].forEach(file => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${user}</td>
        <td>${file}</td>
        <td>
          <button class="preview" onclick="previewFile('${user}','${file}')">Open</button>
          <button class="delete" onclick="deleteFile('${user}','${file}')">Delete</button>
        </td>`;
      tbody.appendChild(tr);
    });
  }
}

// Initial load
loadUsers();
</script>
</body>
</html>
