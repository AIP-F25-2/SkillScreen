<!DOCTYPE html>
<html>
<head>
  <title>Video Admin Dashboard</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; margin: 0; padding: 0; }
    .container { width: 95%; margin: 20px auto; }
    h1, h2 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    table, th, td { border: 1px solid #ccc; }
    th, td { padding: 8px; text-align: left; }
    th { background: #007bff; color: #fff; }
    tr:nth-child(even) { background: #f9f9f9; }
    button { padding: 5px 10px; margin-right: 5px; cursor: pointer; border: none; border-radius: 4px; background: #28a745; color: #fff; }
    button.delete { background: #dc3545; }
    button.preview { background: #17a2b8; }
    .flex-row { display: flex; align-items: center; margin-bottom: 10px; gap: 5px; flex-wrap: wrap; }
    input[type=text], input[type=file], input[type=password] { padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
    .section { padding: 20px; background: #fff; border-radius: 6px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .recording-section video { max-width: 400px; border: 1px solid #ccc; margin-top: 10px; border-radius: 4px; }
    .hint { font-size: 12px; color: #666; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    #loginResponse { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>
<div class="container">
  <h1>Admin Video Dashboard</h1>

  <!-- 🔐 LOGIN SECTION -->
  <div class="section">
    <h2>Login</h2>
    <div class="flex-row">
      <input type="text" id="loginUsername" placeholder="Username">
      <input type="password" id="loginPassword" placeholder="Password">
      <button onclick="login()">Login</button>
      <input type="text" id="tokenInput" placeholder="Token (auto-filled)" style="flex:1;">
      <button onclick="setManualToken()">Set Token</button>
    </div>
    <div id="loginResponse"></div>
  </div>

  <!-- 🎥 Recording Section -->
  <div class="section recording-section">
    <h2>Recording Control</h2>
    <div class="flex-row">
      <input type="text" id="recordInterviewId" placeholder="Enter Interview ID (UUID)">
      <input type="text" id="recordSessionId" placeholder="Enter Session ID (UUID)">
      <button id="startRecBtn">Start Recording</button>
      <button id="stopRecBtn" disabled>Stop Recording</button>
    </div>
    <video id="livePreview" autoplay muted playsinline style="display:none;"></video>
    <div class="hint">
      Uses: <code class="mono">/media/reset_chunks</code>, <code class="mono">/media/upload_chunk</code>, <code class="mono">/media/chunks/status</code>, <code class="mono">/media/finalize_upload</code>
    </div>
  </div>

  <!-- 🎞 Videos -->
  <div class="section">
    <h2>Videos Management</h2>
    <div class="flex-row">
      <button onclick="loadAllVideos()">Load All Videos</button>
    </div>
    <table id="videosTable">
      <thead><tr><th>Interview ID</th><th>Session ID</th><th>Blob Name</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- 📂 Files -->
  <div class="section">
    <h2>General Files Management</h2>
    <div class="flex-row">
      <input type="text" id="fileInterviewId" placeholder="Interview ID for Upload">
      <input type="file" id="generalFile">
      <button onclick="uploadGeneralFile()">Upload File</button>
    </div>
    <div class="flex-row">
      <input type="text" id="fileQuery" placeholder="Search files">
      <button onclick="searchFiles()">Search</button>
    </div>
    <table id="filesTable">
      <thead><tr><th>Interview</th><th>File</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
let API_TOKEN = "";

const originalFetch = window.fetch;
window.fetch = async (url, options = {}) => {
  options.headers = options.headers || {};
  if (API_TOKEN) {
    if (!(options.headers instanceof Headers)) options.headers['Authorization'] = `Bearer ${API_TOKEN}`;
    else options.headers.append('Authorization', `Bearer ${API_TOKEN}`);
  }
  return originalFetch(url, options);
};

async function fetchJSON(url, options = {}) {
  options.headers = options.headers || {};
  if (API_TOKEN) options.headers['Authorization'] = `Bearer ${API_TOKEN}`;
  const res = await fetch(url, options);
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text }; }
  if (!res.ok) throw new Error(data.error || data.message || `HTTP ${res.status}`);
  return data;
}

async function login() {
  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value.trim();
  const box = document.getElementById("loginResponse");
  box.textContent = "Logging in...";
  try {
    const res = await fetch("http://localhost:8080/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    box.textContent = JSON.stringify(data, null, 2);
    if (res.ok && data.token) {
      API_TOKEN = data.token;
      document.getElementById("tokenInput").value = API_TOKEN;
      alert("✅ Login successful!");
    } else alert("Login failed.");
  } catch (err) { box.textContent = err.message; }
}

function setManualToken() {
  const val = document.getElementById("tokenInput").value.trim();
  if (!val) return alert("Enter token first!");
  API_TOKEN = val;
  alert("✅ Token set manually.");
}

/* ========================== RECORDING SECTION ========================== */
let mediaRecorder, liveStream, chunkIndex = 0, requestTimer = null, sessionId = null;
const pendingUploads = [];
const uploadQueue = [];
let uploadWorkerRunning = false;
const CHUNK_MS = 1000, UPLOAD_RETRIES = 3, UPLOAD_BACKOFF_MS = 300;

function chunkName(idx){ return `chunk-${(idx+1).toString().padStart(5,'0')}.webm`; }

function enqueueUpload(form){
  return new Promise((resolve,reject)=>{
    uploadQueue.push({form,resolve,reject,attempts:0});
    if(!uploadWorkerRunning) processUploadQueue();
  });
}

async function processUploadQueue(){
  uploadWorkerRunning = true;
  while(uploadQueue.length){
    const job = uploadQueue.shift();
    let ok=false,lastErr=null;
    while(job.attempts<UPLOAD_RETRIES && !ok){
      try{
        job.attempts++;
        const res = await fetch('/media/upload_chunk',{method:'POST',body:job.form});
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        ok=true; job.resolve(await res.text());
      }catch(e){lastErr=e; await new Promise(r=>setTimeout(r,UPLOAD_BACKOFF_MS*Math.pow(2,job.attempts-1)));}
    }
    if(!ok) job.reject(lastErr);
  }
  uploadWorkerRunning=false;
}

document.getElementById('startRecBtn').addEventListener('click',async()=>{
  const interviewId=document.getElementById('recordInterviewId').value.trim();
  sessionId=document.getElementById('recordSessionId').value.trim();
  if(!interviewId) return alert('Enter Interview ID');
  if(!sessionId) return alert('Enter Session ID');

  chunkIndex=0;
  await fetchJSON('/media/reset_chunks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({interview_id:interviewId,session_id:sessionId})});
  try{liveStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});}catch{alert('Permission denied');return;}
  const preview=document.getElementById('livePreview');preview.srcObject=liveStream;preview.style.display='block';
  const mime='video/webm;codecs=vp8,opus';mediaRecorder=new MediaRecorder(liveStream,{mimeType:mime});
  mediaRecorder.ondataavailable=async(e)=>{
    if(!e.data||e.data.size===0)return;
    const idx=chunkIndex++;const blob=new Blob([e.data],{type:'video/webm'});
    const form=new FormData();form.append('file',blob,chunkName(idx));form.append('interview_id',interviewId);form.append('session_id',sessionId);form.append('chunk_index',idx);
    const p=enqueueUpload(form);pendingUploads.push(p);p.finally(()=>pendingUploads.splice(pendingUploads.indexOf(p),1));
  };
  mediaRecorder.start();requestTimer=setInterval(()=>{if(mediaRecorder.state==='recording')mediaRecorder.requestData();},CHUNK_MS);
  document.getElementById('startRecBtn').disabled=true;document.getElementById('stopRecBtn').disabled=false;
});

document.getElementById('stopRecBtn').addEventListener('click',async()=>{
  const interviewId=document.getElementById('recordInterviewId').value.trim();
  if(!interviewId)return alert('Enter Interview ID');
  clearInterval(requestTimer);requestTimer=null;
  try{mediaRecorder.stop();}catch{}
  liveStream?.getTracks().forEach(t=>t.stop());
  document.getElementById('livePreview').style.display='none';
  // Wait until all uploads finish
  await Promise.allSettled(pendingUploads);

  // ⏳ Add adaptive delay before finalization
  const DELAY_AFTER_LAST_UPLOAD_MS = Math.max(2000, uploadQueue.length * 500);
  console.log(`Waiting ${DELAY_AFTER_LAST_UPLOAD_MS}ms before finalizing...`);
  await new Promise(r => setTimeout(r, DELAY_AFTER_LAST_UPLOAD_MS));

  // Check if any chunks are missing
  const stat = await fetchJSON(`/media/chunks/status?interview_id=${encodeURIComponent(interviewId)}&session_id=${encodeURIComponent(sessionId)}`);
  if (stat.missing && stat.missing.length) {
    return alert(`Missing: ${stat.missing.join(',')}`);
  }

  // ✅ Finalize after delay + verification
  const finalize = await fetchJSON('/media/finalize_upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ interview_id: interviewId, session_id: sessionId })
  });

  alert(`✅ Finalized!\nURL: ${finalize.storage_uri}`);
  document.getElementById('startRecBtn').disabled = false;
  document.getElementById('stopRecBtn').disabled = true;

  document.getElementById('startRecBtn').disabled=false;document.getElementById('stopRecBtn').disabled=true;
});

/* ========================== VIDEO MANAGEMENT ========================== */
async function loadAllVideos(){
  const data=await fetchJSON('/media/admin/videos');
  const tb=document.querySelector('#videosTable tbody');tb.innerHTML='';
  (data.videos||[]).forEach(v=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${v.interview_id}</td><td>${v.session_id}</td><td>${v.blob_name||'-'}</td><td>${v.status||'-'}</td>
    <td><button class="preview" onclick="previewVideo('${v.interview_id}','${v.blob_name}')">Preview</button>
    <button class="delete" onclick="deleteVideo('${v.interview_id}','${v.blob_name}')">Delete</button></td>`;
    tb.appendChild(tr);
  });
}
function previewVideo(id,file){window.open(`/media/video/${id}/${file}`,'_blank');}
async function deleteVideo(id,file){if(!confirm('Delete '+file+'?'))return;await fetchJSON(`/media/admin/video/${id}/${file}`,{method:'DELETE'});loadAllVideos();}

/* ========================== FILE MANAGEMENT ========================== */
async function uploadGeneralFile(){
  const iid=document.getElementById('fileInterviewId').value.trim();
  const f=document.getElementById('generalFile').files[0];
  if(!iid||!f)return alert('Select Interview and File');
  const fd=new FormData();fd.append('interview_id',iid);fd.append('file',f);
  const r=await fetch('/media/files/upload',{method:'POST',body:fd});
  const d=await r.json();
  if(!r.ok)alert('Upload failed');else alert('✅ File uploaded: '+d.file_path);
}
async function searchFiles(){
  const q = document.getElementById('fileQuery').value.trim();
  const data = await fetchJSON(`/media/admin/search/interviews?q=${encodeURIComponent(q)}`);
  const tb = document.querySelector('#filesTable tbody');
  tb.innerHTML = '';

  const results = data.matched_interviews || {};
  for (let interviewId in results) {
    results[interviewId].forEach(file => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${interviewId}</td>
        <td>${file}</td>
        <td>
          <button class="preview" onclick="previewFile('${interviewId}','${file}')">Open</button>
          <button class="delete" onclick="deleteFile('${interviewId}','${file}')">Delete</button>
        </td>`;
      tb.appendChild(tr);
    });
  }

  if (Object.keys(results).length === 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td colspan="3" style="text-align:center;color:#888;">No matches found</td>`;
    tb.appendChild(tr);
  }
}

function previewFile(id,f){window.open(`/media/file/${id}/${f}`,'_blank');}
async function deleteFile(id,f){if(!confirm('Delete '+f+'?'))return;await fetchJSON(`/media/admin/file/${id}/${f}`,{method:'DELETE'});searchFiles();}
</script>
</body>
</html>
