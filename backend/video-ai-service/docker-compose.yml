version: "3.8"

services:
  anti-cheat:
    command: uvicorn app.video_service:app --host 0.0.0.0 --port ${SERVER_PORT}
    build: .
    container_name: video-ai-service
    env_file:
      - .env
    environment:
      # service config
      PORT: ${SERVER_PORT:-8080}
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:?Must provide DATABASE_URL}
      # Ultralytics config
      YOLO_CONFIG_DIR: /app/.ultra_cfg
      YOLOv8_DIR: /app/.ultra_cfg
      PYTHONPATH: /app:/app/common
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    volumes:
      # Host → Container mounts (all read/write)
      - ${UPLOADS_HOST_VOLUME_MOUNT_PATH}:${UPLOAD_FOLDER}
      - ${PROCESSED_HOST_VOLUME_MOUNT_PATH}:${PROCESSED_FOLDER}
      - ${CHEATING_MODEL_PATH}:${MODELS_PATH}
      # Persist Ultralytics settings.json
      - ./ultra_cfg:/app/.ultra_cfg
    restart: unless-stopped
